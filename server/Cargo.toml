[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
# API
axum = { workspace = true }
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
# log
tracing = { workspace = true }
# serde
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
zip = "9"

# cors
tower-http = { workspace = true }

# database
sea-orm = { version = "2", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
sea-orm-migration = "2"

# election
# Pinned to a git rev until a crates.io release includes the structured
# transcript (https://github.com/gendx/stv-rs/issues/3, latest: f09b23d).
stv-rs = { git = "https://github.com/gendx/stv-rs", rev = "f09b23d99d5e55a5c64823fe01a25af8ac5c5886" }

# arithmetic for STV
num = "0.4"

# utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.10"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# email (SMTP)
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
pretty_assertions = "1"
axum-test = "21"
test-log = {version = "0.2", features = ["trace"]}
reqwest = {version = "*", features = ["blocking"]}
regex = "1"
migration = { path = "./migration" }
